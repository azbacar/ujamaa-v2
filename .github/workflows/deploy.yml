name: Deploy Ujamaan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            echo "== Setup environment =="
            export HOME=/home/deploy
            export USER=deploy
            export PATH=/usr/local/bin:/usr/bin:/bin

            echo "== Go to app directory =="
            cd /home/admin/web/ujamaan.com/app

            echo "== Ensure script executable =="
            chmod +x deploy.sh

            echo "== Run deploy =="
            bash deploy.sh

            echo "== Done =="
