#!/usr/bin/env bash
set -e

echo "== Setup environment =="
export HOME=/home/deploy
export USER=deploy
export PATH=/usr/local/bin:/usr/bin:/bin

APP_DIR="/home/admin/web/ujamaan.com/app/source"
WEB_DIR="/home/admin/web/ujamaan.com/public_html"
BRANCH="main"

cd "$APP_DIR"

echo "== Fix Git security =="
git config --global --add safe.directory "$APP_DIR"

echo "== Fix SSH known_hosts =="
mkdir -p ~/.ssh
ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

echo "== Git pull =="
GIT_SSH_COMMAND="ssh -i /home/deploy/.ssh/ujamaan_deploy_key -o StrictHostKeyChecking=no" git fetch --all --prune
GIT_SSH_COMMAND="ssh -i /home/deploy/.ssh/ujamaan_deploy_key -o StrictHostKeyChecking=no" git reset --hard "origin/$BRANCH"

echo "== Install deps =="
npm install

echo "== Build =="
npm run build

echo "== Publish =="
rm -rf "$WEB_DIR"/*
cp -r "$APP_DIR/dist/"* "$WEB_DIR/"

echo "✅ Deploy done."
