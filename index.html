    <!-- Désinscription forcée des Service Workers + purge caches (corrige page blanche iPhone) -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
            }).catch(function () {});
          }
        } catch (e) {}
        try {
          if (typeof window.caches !== 'undefined' && window.caches.keys) {
            window.caches.keys().then(function (keys) {
              keys.forEach(function (k) { try { window.caches.delete(k); } catch (e) {} });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>

    <!-- Filet de sécurité iOS Safari : si l'app crash au boot (storage corrompu, vieux JS),
         on affiche un bouton de réparation au lieu d'une page blanche -->
    <script>
      (function () {
        var bootTimer = setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childNodes.length === 0) {
            root.innerHTML =
              '<div style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#f8fafc;color:#0f172a">' +
                '<div style="max-width:420px">' +
                  '<div style="font-size:42px;margin-bottom:8px">🌴</div>' +
                  '<h1 style="font-size:22px;margin:0 0 8px;color:#059669">Ujamaan</h1>' +
                  '<p style="margin:0 0 20px;color:#475569;font-size:15px;line-height:1.5">Le chargement prend trop de temps. Essayez de vider le cache de votre navigateur pour récupérer la dernière version.</p>' +
                  '<button id="ujRepair" style="background:#059669;color:#fff;border:0;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%;-webkit-appearance:none">🔄 Réinitialiser et recharger</button>' +
                  '<p style="margin:14px 0 0;font-size:12px;color:#94a3b8">Si le problème persiste, ouvrez Réglages → Safari → Effacer historique et données.</p>' +
                '</div>' +
              '</div>';
            var btn = document.getElementById('ujRepair');
            if (btn) {
              btn.addEventListener('click', function () {
                try { localStorage.clear(); } catch (e) {}
                try { sessionStorage.clear(); } catch (e) {}
                try {
                  if (window.caches && caches.keys) {
                    caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); });
                  }
                } catch (e) {}
                try {
                  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                    navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); });
                  }
                } catch (e) {}
                setTimeout(function () { window.location.replace(window.location.origin + '/?_t=' + Date.now()); }, 200);
              });
            }
          }
        }, 8000);
        // Annule le filet quand React monte
        window.addEventListener('ujamaan:ready', function () { clearTimeout(bootTimer); });
      })();
    </script>
