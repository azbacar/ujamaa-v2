    <!-- Nettoyage des anciens Service Workers PWA (corrige les pages blanches iPhone post-PWA) -->

      (function() {
        try {
          if ('serviceWorker' in navigator) {

            }).catch(function() {});

          if (window.caches && caches.keys) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
